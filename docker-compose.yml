services:
  orders-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports:
      - "5440:5432"
    volumes:
      - orders-data:/var/lib/postgresql/data

  payments-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: payments
      MYSQL_USER: payments
      MYSQL_PASSWORD: payments
    ports:
      - "3310:3306"
    volumes:
      - payments-data:/var/lib/mysql

  inventory-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
      POSTGRES_DB: inventory
    ports:
      - "5441:5432"
    volumes:
      - inventory-data:/var/lib/postgresql/data

  notifications-db:
    image: mongo:8
    ports:
      - "27018:27017"
    volumes:
      - notifications-data:/data/db

  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"

  # Receives traces over OTLP (4318) and shows them in a web UI (16686).
  jaeger:
    image: jaegertracing/jaeger:latest
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

volumes:
  orders-data:
  payments-data:
  inventory-data:
  notifications-data:
