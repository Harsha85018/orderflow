spring.application.name=notification-service
server.port=8084

spring.mongodb.uri=mongodb://localhost:27018/notifications

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service
# On first start, read the topic from the beginning instead of only new messages.
spring.kafka.consumer.auto-offset-reset=earliest

# Tracing: record every request and send spans to Jaeger.
management.tracing.sampling.probability=1.0
# Spring Boot 4 renamed this property; both spellings are set so whichever
# this version reads points at Jaeger. The other is ignored.
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
# Carry the trace through Kafka message headers.
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true
# Jaeger only accepts traces; metrics go to Prometheus instead (next step).
management.otlp.metrics.export.enabled=false

# Metrics for Prometheus at /actuator/prometheus.
management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# One consumer thread per partition (topics have 3). Ordering per order is
# unchanged: each order's messages share a key, so they stay on one partition,
# and a partition is only ever read by one thread.
spring.kafka.listener.concurrency=3
