spring.application.name=payment-service
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3310/payments?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=payments
spring.datasource.password=payments

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.acks=all
spring.kafka.consumer.group-id=payment-service
spring.kafka.consumer.auto-offset-reset=earliest
